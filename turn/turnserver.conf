# coturn configuration for voip-lab.
#
# STUN + TURN on the standard ports. Authentication is long-term
# credentials via a shared secret (coturn's `use-auth-secret` mode):
# the signaling server derives time-limited TURN usernames/passwords
# from the same secret (see server/src/ice.ts), so no static user
# accounts are stored here.
#
# The secret itself is NOT in this file. The compose file passes it on
# the command line from the TURN_SECRET environment variable; if you run
# turnserver by hand, pass --static-auth-secret=<secret> or add a
# `static-auth-secret=<secret>` line here and keep the file private.

listening-port=3478
# TLS (5349) is off by default: coturn needs a certificate and key to
# serve TLS, and this repo ships none. To enable it, provision a real
# certificate, uncomment the three lines below, and set TURN_TLS=true
# on the signaling server so it advertises the turns: URL.
# tls-listening-port=5349
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
listening-ip=0.0.0.0

# Fingerprint in STUN responses (RFC 5389) and long-term credential
# mechanism (RFC 5389 / RFC 5766).
fingerprint
lt-cred-mech

# Time-limited credentials derived from a shared secret.
use-auth-secret

# Realm shown to clients and used in the HMAC.
realm=voip-lab

# A name for logs only.
server-name=voip-lab-turn

# Do not forward relayed traffic to loopback or private networks:
# a TURN server that relays to 127.0.0.1/10/192.168 is an open proxy.
no-loopback-peers
no-multicast-peers

# Relay port range (UDP) and an explicit external IP when the host is
# behind NAT: set external-ip=<public-ip> in production, or coturn
# will advertise the container's private address to peers.
min-port=49152
max-port=65535

# Verbose enough to see allocation requests in `docker compose logs`.
verbose
